<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Cone defect geometry</title>
<desc id="d">Close-up of the reported cone defect: 100 nm height, 50 nm base, 8-12 nm tip radius.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a30"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker>
</defs>
<rect width="880" height="480" fill="#ffffff"/>
<text x="440.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2a30">Cone-defect geometry (reported)</text>
<text x="440.0" y="50.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6770">Silicon protrusion rising from the trench floor, tip at mid-trench depth</text>
<clipPath id="cl"><rect x="300" y="72" width="560" height="360"/></clipPath>
