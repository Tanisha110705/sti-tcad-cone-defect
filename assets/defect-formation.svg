<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Cone defect formation</title>
<desc id="d">Four-step sequence showing residue micromasking producing a silicon cone at the trench bottom.</desc>
