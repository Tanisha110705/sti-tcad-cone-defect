<line x1="868.0" y1="285.0" x2="857.0" y2="265.0" stroke="#c0392b" stroke-width="1"/>
<text x="855.0" y="247.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">sharp tip</text>
<text x="855.0" y="261.0" font-size="11" text-anchor="end" font-weight="normal" fill="#c0392b">r ≈ 8–12 nm</text>
<text x="500.0" y="425.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1f2a30">Silicon under the residue survives while the exposed floor is etched; lateral erosion of the residue tapers the protrusion into a cone.</text>
<text x="500.0" y="460.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5b6770" font-style="italic">Conceptual drawing. In the Sentaurus flow the defect is an explicit 'cone defect introduction' step, not a plasma-chemistry simulation.</text>
