<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">STI process flow</title>
<desc id="d">Nine-step STI process flow from substrate to final STI with embedded cone defect.</desc>
