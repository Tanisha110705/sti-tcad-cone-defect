<text x="500.0" y="310.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5b6770" font-style="italic">Conceptual flow. Step 6 (red) is the project's distinguishing step; the report also lists an optional liner oxidation between steps 6 and 7.</text>
