<line x1="896.0" y1="156.0" x2="896.0" y2="188.0" stroke="#1f2a30" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="812.0" y1="235.0" x2="786.0" y2="235.0" stroke="#1f2a30" stroke-width="1.5" marker-end="url(#arr)"/>
