<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Oxide thinning above cone tip</title>
<desc id="d">Bar comparison of reported nominal oxide thickness (about 150 nm) and oxide above the cone tip (50 to 70 nm).</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a30"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker>
</defs>
<rect width="760" height="420" fill="#ffffff"/>
<text x="380.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2a30">Local oxide thinning above the cone tip</text>
<text x="380.0" y="50.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#c0392b">Reported in project documentation — not extracted from a TCAD structure in this repository</text>
<rect x="140.0" y="120.0" width="120.0" height="210.0" rx="0" fill="#a8e6f2" stroke="#3fa7bd" stroke-width="1.2"/>
<text x="200.0" y="110.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2a30">~150 nm</text>
<text x="200.0" y="352.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2a30">Nominal trench oxide</text>
<text x="200.0" y="368.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5b6770">(trench bottom, defect-free)</text>
<rect x="380.0" y="232.0" width="120.0" height="98.0" rx="0" fill="#a8e6f2" stroke="#3fa7bd" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="380.0" y="260.0" width="120.0" height="70.0" rx="0" fill="#a8e6f2" stroke="#3fa7bd" stroke-width="1.2"/>
<text x="440.0" y="222.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#c0392b">50–70 nm</text>
<text x="440.0" y="352.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2a30">Above cone tip</text>
<text x="440.0" y="368.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5b6770">(≈ 60 nm used in report §6.3, §9)</text>
<line x1="100.0" y1="330.0" x2="560.0" y2="330.0" stroke="#1f2a30" stroke-width="1.2"/>
<line x1="264.0" y1="120.0" x2="376.0" y2="120.0" stroke="#5b6770" stroke-width="0.8" stroke-dasharray="3,3"/>
<line x1="440.0" y1="124.0" x2="440.0" y2="204.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrR)"/>
<text x="450.0" y="150.0" font-size="13" text-anchor="start" font-weight="bold" fill="#c0392b">−53 % to −67 %</text>
<rect x="580.0" y="120.0" width="165.0" height="168.0" rx="8" fill="#f5f7f8" stroke="#c9d2d7" stroke-width="1.2"/>
<text x="662.0" y="146.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a30">Field for the same V</text>
<text x="662.0" y="166.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1f2a30">E ≈ V / t_ox</text>
<text x="662.0" y="186.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#c0392b">150 → 70 nm: ×2.1</text>
<text x="662.0" y="206.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#c0392b">150 → 50 nm: ×3.0</text>
<text x="662.0" y="226.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#5b6770">calculated, uniform-</text>
<text x="662.0" y="246.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#5b6770">field (parallel-plate)</text>
<text x="662.0" y="266.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#5b6770">approximation</text>
<text x="380.0" y="410.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5b6770" font-style="italic">Bar heights to scale (1.4 px/nm). Percentages and field ratios are calculated from the reported thicknesses.</text>
</svg>
