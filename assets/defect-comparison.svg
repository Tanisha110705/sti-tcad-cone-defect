<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Reported versus observed defect geometry</title>
<desc id="d">Left: report-described upward silicon cone. Right: geometry estimated from the Sentaurus Visual screenshots, a narrow oxide-filled recess below the trench floor.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a30"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker>
</defs>
<rect width="980" height="520" fill="#ffffff"/>
<text x="490.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2a30">Defect geometry: report description vs. Sentaurus screenshots</text>
<text x="490.0" y="50.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#c0392b">The available cut-plane images do not show an upward Si spike; they show a narrow oxide-filled recess below the trench floor</text>
<text x="241.6" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2a30">A · Report text (§5.1, §6.1)</text>
<text x="241.6" y="110.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6770">Si cone rises 100 nm from the floor into the oxide</text>
