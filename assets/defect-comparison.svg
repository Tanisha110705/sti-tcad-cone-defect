<polygon points="185.8,150.0 297.4,150.0 297.4,150.0 293.1,274.0 257.1,274.0 243.1,212.2 242.7,212.1 242.4,212.0 242.0,212.0 241.6,212.0 241.2,212.0 240.8,212.0 240.5,212.1 240.1,212.2 226.1,274.0 190.1,274.0 185.8,150.0" fill="#a8e6f2" stroke="#3fa7bd" stroke-width="1" stroke-linejoin="round"/>
<line x1="241.6" y1="209.0" x2="241.6" y2="142.0" stroke="#c0392b" stroke-width="1"/>
<text x="241.6" y="136.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#c0392b">Si tip pointing up</text>
<text x="241.6" y="470.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2a30">88° walls · 200 nm deep · 180 nm wide (reported)</text>
<polygon points="515.0,150.0 589.4,150.0 659.1,289.5 694.8,289.5 694.8,356.5 722.7,356.5 722.7,289.5 758.4,289.5 828.1,150.0 902.5,150.0 902.5,429.0 515.0,429.0" fill="#8a9ea8" stroke="#5d727c" stroke-width="1" stroke-linejoin="round"/>
<polygon points="589.4,150.0 659.1,289.5 694.8,289.5 694.8,356.5 722.7,356.5 722.7,289.5 758.4,289.5 828.1,150.0" fill="#a8e6f2" stroke="#3fa7bd" stroke-width="1" stroke-linejoin="round"/>
<text x="708.8" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2a30">B · Sentaurus cut-plane (estimated)</text>
<text x="708.8" y="110.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6770">Narrow recess extends below the trench floor</text>
<rect x="774.7" y="319.0" width="140.0" height="54.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
<line x1="724.7" y1="323.0" x2="774.7" y2="333.0" stroke="#c0392b" stroke-width="1"/>
<text x="782.7" y="336.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b">oxide-filled notch</text>
<text x="782.7" y="351.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#c0392b">≈ 105–115 nm deep</text>
<text x="782.7" y="365.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#c0392b">≈ 40–60 nm wide</text>
<text x="708.8" y="470.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2a30">≈ 62–64° walls · ≈ 220–230 nm deep · ≈ 380 nm opening</text>
<text x="708.8" y="486.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5b6770">(pixel estimates from screenshots, ± ~10–15 nm)</text>
<line x1="490.0" y1="80.0" x2="490.0" y2="490.0" stroke="#c9d2d7" stroke-width="1"/>
<text x="490.0" y="510.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5b6770" font-style="italic">A: conceptual, reported dimensions. B: redrawn from scripts/analysis/measure_tcad_screenshots.py estimates (same scale). Original .tdr files unavailable.</text>
</svg>
