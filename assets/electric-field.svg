<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker>
</defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="450.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2a30">Why a sharp tip concentrates the electric field</text>
<text x="450.0" y="50.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#c0392b">Conceptual field-line sketch — NOT a Sentaurus Device solution (no device simulation in this project)</text>
