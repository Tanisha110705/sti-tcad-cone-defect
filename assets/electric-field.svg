<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Electric-field enhancement</title>
<desc id="d">Side-by-side conceptual field lines: uniform field across a flat oxide versus crowded field lines at a sharp silicon cone tip.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a30"/></marker>
