<circle cx="670.0" cy="197" r="14" fill="#c0392b" fill-opacity="0.18" stroke="#c0392b" stroke-width="1"/>
<text x="692.0" y="189.0" font-size="13" text-anchor="start" font-weight="bold" fill="#c0392b">E_tip ≈ β · E_avg</text>
<text x="670.0" y="90.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2a30">Cone tip: field lines crowd at small radius</text>
<text x="670.0" y="115.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2a30">conductor above STI (illustrative)</text>
<text x="670.0" y="344.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2a30">β ≈ 10 (reported estimate; = h / r_tip = 100 / 10)</text>
<text x="450.0" y="382.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1f2a30">Thin oxide (larger E_avg) and a sharp tip (larger β) multiply: the tip is the highest-stress point of the STI dielectric.</text>
<text x="450.0" y="420.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5b6770" font-style="italic">β value from the report (method not stated); h/r interpretation is a first-order approximation. No field values were simulated.</text>
</svg>
