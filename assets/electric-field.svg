<line x1="295.0" y1="126.0" x2="295.0" y2="294.0" stroke="#1f6fb2" stroke-width="1.2" marker-end="url(#arrB)"/>
<line x1="330.0" y1="126.0" x2="330.0" y2="294.0" stroke="#1f6fb2" stroke-width="1.2" marker-end="url(#arrB)"/>
<line x1="365.0" y1="126.0" x2="365.0" y2="294.0" stroke="#1f6fb2" stroke-width="1.2" marker-end="url(#arrB)"/>
<text x="225.0" y="90.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2a30">Flat interface: uniform field</text>
<text x="225.0" y="115.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2a30">conductor above STI (illustrative)</text>
<text x="225.0" y="313.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#ffffff">silicon</text>
<text x="225.0" y="344.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2a30">E = V / t_ox  (β = 1)</text>
<rect x="500.0" y="100.0" width="340.0" height="22.0" rx="0" fill="#b9c4c9" stroke="#5d727c" stroke-width="1"/>
